<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one calm column (wider on tablets), bottom tab bar, and one big cobalt flashcard as the single bold moment. */
:root{
  --bg:#F1F4FB; --surface:#FFFFFF; --ink:#0E1A33; --muted:#52627F; --line:#D8DFEE;
  --accent:#2548D9; --on-accent:#FFFFFF; --sun:#FFC83D; --on-sun:#2A2000;
  --card:#2548D9; --card-ink:#FFFFFF; --card-soft:rgba(255,255,255,.78);
  --ok:#0F7F5A; --ok-bg:#DDF3EA; --bad:#B93434; --bad-bg:#FBE3E3;
  --der:#2556CC; --die:#C42C5A; --das:#0E7A4D;
  --pill-der:#2556CC; --pill-die:#C42C5A; --pill-das:#0E7A4D;
  --font-display:'Unbounded','Onest',system-ui,sans-serif;
  --font-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1020; --surface:#131D36; --ink:#E9EEFF; --muted:#9AA8C9; --line:#25335A;
    --accent:#8AA2FF; --on-accent:#0A1230; --card:#1B2B66;
    --ok:#4FD1A0; --ok-bg:#12372D; --bad:#FF8A8A; --bad-bg:#3A1C20;
    --der:#86A6FF; --die:#FF8BAA; --das:#4FD1A0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1020; --surface:#131D36; --ink:#E9EEFF; --muted:#9AA8C9; --line:#25335A;
  --accent:#8AA2FF; --on-accent:#0A1230; --card:#1B2B66;
  --ok:#4FD1A0; --ok-bg:#12372D; --bad:#FF8A8A; --bad-bg:#3A1C20;
  --der:#86A6FF; --die:#FF8BAA; --das:#4FD1A0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:500 18px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{max-width:640px;margin:0 auto;padding-block:16px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view{display:flex;flex-direction:column;gap:16px;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.display{font:700 clamp(28px,8vw,40px)/1.1 var(--font-display);letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.h1{font:700 26px/1.15 var(--font-display);text-wrap:balance}
h2{font-size:20px;font-weight:700}
.eyebrow{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lead{color:var(--muted);font-size:19px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{font:700 15px var(--font-display);letter-spacing:.01em}
.mark::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--sun);margin-right:8px;vertical-align:-1px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;color:var(--muted);font-size:16px}
.note.warn{border-color:var(--bad);color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 22px;border-radius:18px;border:2px solid transparent;font-weight:700;font-size:19px;text-align:center;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.outline{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);padding:8px 12px;min-height:48px}
.btn.small{font-size:17px}
.btn.wide{width:100%}
.btn.danger{background:var(--bad);color:var(--surface)}
.icon-btn{flex:none;width:48px;height:48px;border-radius:50%;border:0;display:inline-grid;place-items:center;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.icon-btn.ghost{background:transparent;border-color:transparent}
.icon-btn.sun{background:var(--sun);color:var(--on-sun);border-color:transparent}
.icon-btn.mini{width:42px;height:42px}

.progress{display:flex;align-items:center;gap:18px}
.ring{width:128px;height:128px;flex:none}
.ring-n{font:700 32px var(--font-display);fill:var(--ink)}
.ring-s{font:600 12px var(--font-body);fill:var(--muted)}
.progress p{color:var(--muted);font-size:16px;margin-top:4px}

.actions{display:flex;flex-direction:column;gap:12px}
.act{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;min-height:76px}
.act b{display:block;font-size:19px}
.act span.sub{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.act.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.act.main span.sub{color:var(--on-accent);opacity:.85}
.act:disabled{opacity:.6;cursor:default}
.arrow{flex:none;transform:rotate(180deg)}

.topics{display:grid;gap:12px;grid-template-columns:1fr}
.topic{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;min-width:0}
.topic .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.topic b{font-size:19px}
.topic .de-t{color:var(--muted);font-size:15px}
.topic .cnt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px}

.sbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.count{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);transition:width .25s}

.fcard{background:var(--card);color:var(--card-ink);border-radius:28px;padding:22px 20px 24px;display:flex;flex-direction:column;gap:16px;min-height:280px;min-width:0}
.fcard .tag{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--card-soft);font-weight:600}
.word-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.de{font-weight:700;font-size:clamp(34px,10vw,52px);line-height:1.1;overflow-wrap:anywhere;min-width:0;text-wrap:balance}
.fcard .art{background:#fff;padding:1px 12px;border-radius:999px;font-size:.55em;vertical-align:.18em;margin-right:6px;display:inline-block;line-height:1.35}
.fcard .art-der{color:var(--pill-der)} .fcard .art-die{color:var(--pill-die)} .fcard .art-das{color:var(--pill-das)}
.art{font-weight:700}
.art-der{color:var(--der)} .art-die{color:var(--die)} .art-das{color:var(--das)}
.reveal{display:flex;flex-direction:column;gap:14px;border-top:1px solid rgba(255,255,255,.3);padding-top:16px}
.reveal .ru{font-size:clamp(26px,7vw,34px);font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.readrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lbl{font-size:15px;color:var(--card-soft)}
.read{display:inline-flex;background:var(--sun);color:var(--on-sun);padding:6px 16px;border-radius:999px;font-weight:700;font-size:21px}
.exbox{background:rgba(255,255,255,.12);border-radius:18px;padding:14px 16px}
.exline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.exde{font-size:21px;font-weight:600;overflow-wrap:anywhere}
.exru{color:var(--card-soft);margin-top:6px;font-size:17px}
.ru-q{font-size:clamp(30px,8.5vw,44px)}

.cta{display:flex;gap:12px;position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.cta .btn{flex:1}

.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;min-height:64px;padding:14px 18px;border-radius:18px;background:var(--surface);border:2px solid var(--line);font-size:20px;font-weight:600}
.opt:disabled{opacity:1;cursor:default}
.opt.correct{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt .mk{flex:none;display:inline-flex}
.opt.correct .mk{color:var(--ok)} .opt.wrong .mk{color:var(--bad)}
.fb{border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)}
.fb-h{font-weight:700;display:flex;align-items:center;gap:8px;font-size:19px}
.fb.ok .fb-h{color:var(--ok)} .fb.bad .fb-h{color:var(--bad)}
.fb-s{color:var(--muted);font-size:16px}

.score{font:700 56px/1 var(--font-display);font-variant-numeric:tabular-nums}
.score small{font-size:24px;color:var(--muted)}
.resbox{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.mist{display:flex;flex-direction:column;gap:8px}
.mist .m{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px 10px 16px}
.mist .m span{min-width:0;overflow-wrap:anywhere}
.mist .m em{display:block;font-style:normal;color:var(--muted);font-size:15px}

.testfinal{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);color:var(--card-ink);border:0;border-radius:24px;padding:20px}
.testfinal b{font:700 22px var(--font-display)}
.testfinal span{color:var(--card-soft)}
.pill{display:inline-flex;align-self:flex-start;background:var(--sun);color:var(--on-sun);font-weight:700;border-radius:999px;padding:4px 14px;font-size:16px;margin-top:6px}

.search{width:100%;min-height:56px;border-radius:18px;border:2px solid var(--line);background:var(--surface);padding:0 18px;font-size:19px}
.search:focus{border-color:var(--accent);outline:none}
.grp{display:flex;flex-direction:column;gap:8px}
.grp h2{font-size:17px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding-top:8px}
.wrow{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.wrow summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;cursor:pointer;min-height:64px}
.wrow summary::-webkit-details-marker{display:none}
.wrow .w{flex:1;min-width:0}
.wrow .w b{font-size:20px;overflow-wrap:anywhere}
.wrow .w span{display:block;color:var(--muted);font-size:16px}
.st{font-size:13px;font-weight:700;border-radius:99px;padding:2px 10px;white-space:nowrap}
.st-done{background:var(--ok-bg);color:var(--ok)}
.st-learn{background:var(--line);color:var(--muted)}
.wex{padding:0 16px 14px;border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.wex .rd{font-size:16px;color:var(--muted)} .wex .rd b{color:var(--ink)}
.wex .e1{font-weight:600;font-size:19px} .wex .e2{color:var(--muted);font-size:16px}

form.name{display:flex;flex-direction:column;gap:12px}
form.name label{font-weight:700}
.field{width:100%;min-height:58px;border-radius:18px;border:2px solid var(--line);background:var(--surface);padding:0 18px;font-size:21px}
.field:focus{border-color:var(--accent);outline:none}
.welcome{display:flex;flex-direction:column;gap:18px;padding-top:6vh}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:16px;font-weight:600}
.chip b{color:var(--accent)}
.setrow{display:flex;gap:10px;flex-wrap:wrap}
.setrow .field{flex:1;min-width:0}
.set{display:flex;flex-direction:column;gap:14px}

#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#bar nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--muted);border-radius:14px;min-height:60px;font-size:14px;font-weight:600;padding:6px 2px}
.tab[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (min-width:760px){
  .app{max-width:760px}
  #bar nav{max-width:760px}
  .topics{grid-template-columns:1fr 1fr}
  .fcard{padding:32px 30px 34px}
  .progress{gap:28px;padding:24px}
}
@media (prefers-reduced-motion:reduce){#view{animation:none}.btn,.prog span{transition:none}}
</style>

   '<input class="field" id="nameinput" name="name" autocomplete="given-name" maxlength="30" required placeholder="Например, Дмитрий">'+
   '<button class="btn primary wide" type="submit">Начать</button></form>'+
   '<div class="chips"><span class="chip"><b>100</b> слов</span><span class="chip">с произношением</span><span class="chip">с примерами</span><span class="chip">с тестами</span></div>'+
  '</section>';
}
function settingsPanel(){
  return '<section class="panel set"><h2>Настройки</h2>'+
   '<div><label for="renameinput" class="eyebrow">Имя</label><div class="setrow" style="margin-top:8px"><input class="field" id="renameinput" maxlength="30" value="'+esc(S.name)+'"><button class="btn primary" data-a="rename">Сохранить</button></div></div>'+
   '<p class="lead" style="font-size:16px">Чтобы открывать как приложение: в браузере нажмите «Поделиться» и выберите «На экран Домой».</p>'+
   (confirmReset?
     '<div class="note warn">Весь прогресс и результаты тестов будут удалены.</div><div class="setrow"><button class="btn danger" data-a="reset-yes">Да, сбросить</button><button class="btn outline" data-a="reset-no">Отмена</button></div>'
     :'<button class="btn outline" data-a="reset">Сбросить прогресс</button>')+
  '</section>';
}
function homeView(){
  var n=learnedCount(), p=n/100, ng=nextGroup(), weak=weakWords(), g=greeting(), C=2*Math.PI*52;
  var contSub = ng===null ? 'Все темы выучены. Пройдите итоговый тест.' : DATA.groups[ng].title+' · выучено '+groupStat(ng).n+' из '+groupStat(ng).t;
  var ring='<circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="12"/>'+
    (n>0?'<circle cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-p)).toFixed(1)+'" transform="rotate(-90 60 60)"/>':'');
  return '<header class="top"><span class="mark">Deutsch 100</span><button class="icon-btn ghost" data-a="settings" aria-label="Настройки" aria-expanded="'+settingsOpen+'">'+I('gear')+'</button></header>'+
  (settingsOpen?settingsPanel():'')+
  (!storageOk?'<p class="note warn">В этом окне браузера прогресс не сохраняется. Откройте страницу в обычном окне, не в приватном режиме.</p>':'')+
  '<section><p class="eyebrow">'+g[0]+' · '+g[1]+'</p><h1 class="display">Hallo, '+esc(S.name)+'!</h1></section>'+
  '<section class="panel progress"><svg class="ring" viewBox="0 0 120 120" role="img" aria-label="Выучено '+n+' из 100">'+ring+
    '<text x="60" y="66" text-anchor="middle" class="ring-n">'+n+'</text><text x="60" y="86" text-anchor="middle" class="ring-s">из 100</text></svg>'+
    '<div><h2>Выучено слов</h2><p>'+(n===0?'Начните с первой темы. Хватит 10 минут в день.':'Слово считается выученным, когда вы знаете его два раза.')+'</p></div></section>'+
  '<section class="actions">'+
    '<button class="act main" data-a="continue"><span><b>'+(ng===null?'Повторить всё':'Продолжить учить')+'</b><span class="sub">'+esc(contSub)+'</span></span><span class="arrow">'+I('back')+'</span></button>'+
    '<button class="act" data-a="repeat" '+(weak.length?'':'disabled')+'><span><b>Повторить слабые слова</b><span class="sub">'+(weak.length?('Слов для повторения: '+weak.length):'Пока нечего повторять')+'</span></span><span class="arrow">'+I('back')+'</span></button>'+
    '<button class="act" data-a="final"><span><b>Итоговый тест</b><span class="sub">30 вопросов по всем темам</span></span><span class="arrow">'+I('back')+'</span></button>'+
  '</section>';
}
function learnView(){
  var h='<h1 class="h1">Темы</h1><p class="lead">Выберите тему и пройдите карточки. В каждой теме 10 слов.</p><div class="topics">';
  DATA.groups.forEach(function(g,gi){
    var s=groupStat(gi);
    h+='<button class="topic" data-a="topic" data-g="'+gi+'"><span class="row"><span><b>'+esc(g.title)+'</b><br><span class="de-t">'+esc(g.de)+'</span></span><span class="cnt">'+s.n+' / '+s.t+'</span></span><span class="bar"><span style="width:'+(s.n/s.t*100)+'%"></span></span></button>';
  });
  return h+'</div>';
}
function testView(){
  var f=S.results.final, h='<h1 class="h1">Тесты</h1>';
  h+='<button class="testfinal" data-a="final"><b>Итоговый тест</b><span>30 вопросов из всех тем</span><span class="pill">'+(f?('Лучший результат: '+f.best+' из '+f.total):'Ещё не проходили')+'</span></button>';
  h+='<h2>Тесты по темам</h2><div class="topics">';
  DATA.groups.forEach(function(g,gi){
    var r=S.results['g'+gi];
    h+='<button class="topic" data-a="topic-test" data-g="'+gi+'"><span class="row"><b>'+esc(g.title)+'</b><span class="cnt">'+(r?(r.best+' / '+r.total):'—')+'</span></span><span class="de-t">'+(r?'Лучший результат':'Ещё не проходили')+'</span></button>';
  });
  return h+'</div>';
}
function listHtml(){
  var q=filter.trim().toLowerCase(), out='', any=false;
  DATA.groups.forEach(function(g,gi){
    var ws=WORDS.filter(function(w){
      return w.g===gi && (!q || (w.de+' '+w.ru+' '+w.read).toLowerCase().indexOf(q)>=0);
    });
    if(!ws.length) return; any=true;
    out+='<section class="grp"><h2>'+esc(g.title)+'</h2>';
    ws.forEach(function(w){
      var b=boxOf(w.id), st=b>=2?'<span class="st st-done">выучено</span>':((w.id in S.box)?'<span class="st st-learn">учу</span>':'');
      out+='<details class="wrow"><summary><div class="w"><b>'+deHtml(w.de)+'</b><span>'+esc(w.ru)+'</span></div>'+st+sayBtn(w.de,'mini')+'</summary>'+
        '<div class="wex"><p class="rd">Читается: <b>'+esc(w.read)+'</b></p><p class="e1">'+esc(Pn(w.ex))+'</p><p class="e2">'+esc(Pn(w.exru))+'</p></div></details>';
    });
    out+='</section>';
  });
  return any?out:'<p class="note">Ничего не найдено. Попробуйте другое слово.</p>';
}
function wordsView(){
  return '<h1 class="h1">Все 100 слов</h1><label class="vh" for="q">Поиск</label><input class="search" id="q" type="search" placeholder="Поиск по слову или переводу" value="'+esc(filter)+'" autocomplete="off"><div id="wl" style="display:flex;flex-direction:column;gap:12px">'+listHtml()+'</div>';
}

/* ---------- Cards ---------- */
function startCards(ids,title,g,tip){
  mode={type:'cards',ids:ids.slice(),i:0,shown:false,title:title,g:g,tip:tip||'',know:0,again:0,req:{}};
  render();
}
function cardsView(){
  var m=mode, total=m.ids.length;
  if(m.i>=total) return cardsDone();
  var w=WORDS[m.ids[m.i]];
  var h='<div class="sbar"><button class="btn ghost small" data-a="exit">'+I('back')+'<span>Выйти</span></button><span class="count">'+(m.i+1)+' / '+total+'</span></div>'+
   '<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="'+total+'" aria-valuenow="'+m.i+'"><span style="width:'+Math.round(m.i/total*100)+'%"></span></div>';
  if(m.i===0&&m.tip) h+='<p class="note">'+esc(m.tip)+'</p>';
  h+='<article class="fcard"><p class="tag">'+esc(m.title)+'</p><div class="word-row"><p class="de">'+deHtml(w.de)+'</p>'+sayBtn(w.de,'sun')+'</div>';
  if(m.shown){
    h+='<div class="reveal"><p class="ru">'+esc(w.ru)+'</p><div class="readrow"><span class="lbl">Читается</span><span class="read">'+esc(w.read)+'</span></div>'+
       '<div class="exbox"><div class="exline"><p class="exde">'+esc(Pn(w.ex))+'</p>'+sayBtn(w.ex,'sun mini')+'</div><p class="exru">'+esc(Pn(w.exru))+'</p></div></div>';
  }
  h+='</article><div class="cta">'+(m.shown?'<button class="btn outline" data-a="again">Ещё раз</button><button class="btn primary" data-a="know">Знаю</button>':'<button class="btn primary" data-a="reveal">Показать перевод</button>')+'</div>';
  return h;
}
function cardsDone(){
  var m=mode;
  return '<section class="panel resbox"><p class="eyebrow">Готово</p><h1 class="h1">'+esc(S.name)+', отличная работа!</h1>'+
   '<p class="lead">Знаю: '+m.know+'. Нужно повторить: '+m.again+'.</p></section>'+
   '<div class="actions">'+
   (m.g!==null?'<button class="btn primary wide" data-a="topic-test" data-g="'+m.g+'">Пройти тест по теме</button>':'')+
   '<button class="btn outline wide" data-a="exit">'+(m.g!==null?'К темам':'На главную')+'</button></div>';
}

/* ---------- Quiz ---------- */
function makeQ(w,pool,dir){
  var bad=shuffle(pool.filter(function(x){return x.id!==w.id&&x.ru!==w.ru&&x.de!==w.de;})).slice(0,3);
  return {id:w.id,dir:dir,opts:shuffle([w].concat(bad)).map(function(x){return x.id;})};
}
function startQuiz(key,g){
  var ids,pool,label;
  if(key==='final'){
    ids=[];DATA.groups.forEach(function(_,gi){ids=ids.concat(shuffle(WORDS.filter(function(w){return w.g===gi;})).slice(0,3));});
    ids=shuffle(ids);pool=WORDS;label='Итоговый тест';
  }else{
    ids=shuffle(WORDS.filter(function(w){return w.g===g;}));pool=WORDS.filter(function(w){return w.g===g;});label='Тест: '+DATA.groups[g].title;
  }
  var dirs=shuffle(ids.map(function(_,i){return i%2?'de2ru':'ru2de';}));
  var qs=ids.map(function(w,i){return makeQ(w,pool,dirs[i]);});
  mode={type:'quiz',key:key,g:g,label:label,qs:qs,i:0,picked:null,score:0,wrong:[]};
  render();
}
function quizView(){
  var m=mode,total=m.qs.length;
  if(m.i>=total) return quizDone();
  var q=m.qs[m.i],w=WORDS[q.id],shown=m.picked!==null,ok=m.picked===q.id;
  var h='<div class="sbar"><button class="btn ghost small" data-a="exit">'+I('back')+'<span>Выйти</span></button><span class="count">Вопрос '+(m.i+1)+' из '+total+'</span></div>'+
   '<div class="prog"><span style="width:'+Math.round(m.i/total*100)+'%"></span></div>';
  h+='<article class="fcard" style="min-height:0">';
  if(q.dir==='de2ru') h+='<p class="tag">Что это значит?</p><div class="word-row"><p class="de">'+deHtml(w.de)+'</p>'+sayBtn(w.de,'sun')+'</div>';
  else h+='<p class="tag">Как сказать по-немецки?</p><p class="de ru-q">'+esc(w.ru)+'</p>';
  h+='</article><div class="opts">';
  q.opts.forEach(function(oid){
    var o=WORDS[oid],cls='',mk='';
    if(shown&&oid===q.id){cls=' correct';mk='<span class="mk">'+I('check')+'<span class="vh">верно</span></span>';}
    else if(shown&&oid===m.picked){cls=' wrong';mk='<span class="mk">'+I('x')+'<span class="vh">неверно</span></span>';}
    h+='<button class="opt'+cls+'" data-a="pick" data-id="'+oid+'"'+(shown?' disabled':'')+'><span>'+(q.dir==='de2ru'?esc(o.ru):deHtml(o.de))+'</span>'+mk+'</button>';
  });
  h+='</div>';
  if(shown){
    h+='<div class="fb '+(ok?'ok':'bad')+'"><p class="fb-h">'+(ok?I('check')+'Верно!':I('x')+'Не совсем')+'</p>'+
      (ok?'':'<p>Правильно: <b>'+esc(w.de)+'</b> — '+esc(w.ru)+'</p>')+
      '<p class="fb-s">Читается: '+esc(w.read)+'. Пример: '+esc(Pn(w.ex))+'</p></div>'+
      '<div class="cta"><button class="btn primary" data-a="next">'+(m.i+1>=total?'Результат':'Дальше')+'</button></div>';
  }
  return h;
}
function quizDone(){
  var m=mode,total=m.qs.length,pct=m.score/total;
  var msg=pct>=.9?'Отлично, '+S.name+'!':pct>=.7?'Хорошо, '+S.name+'!':'Нужно ещё потренироваться, '+S.name+'.';
  var h='<section class="panel resbox"><p class="eyebrow">'+esc(m.label)+'</p><p class="score">'+m.score+' <small>из '+total+'</small></p><h1 class="h1">'+esc(msg)+'</h1></section>';
  if(m.wrong.length){
    h+='<h2>Над чем поработать</h2><div class="mist">';
    m.wrong.forEach(function(id){var w=WORDS[id];h+='<div class="m"><span><b>'+esc(w.de)+'</b><em>'+esc(w.ru)+' · '+esc(w.read)+'</em></span>'+sayBtn(w.de,'mini')+'</div>';});
    h+='</div>';
  }
  h+='<div class="actions">'+(m.wrong.length?'<button class="btn primary wide" data-a="redo-wrong">Повторить ошибки</button>':'')+
     '<button class="btn '+(m.wrong.length?'outline':'primary')+' wide" data-a="quiz-again">Пройти ещё раз</button>'+
     '<button class="btn outline wide" data-a="exit">Закончить</button></div>';
  return h;
}
function finishQuiz(){
  var m=mode,k=m.key==='final'?'final':'g'+m.g,prev=S.results[k];
  S.results[k]={best:Math.max(prev?prev.best:0,m.score),total:m.qs.length,last:m.score,date:Date.now()};
  save();
}

/* ---------- Render ---------- */
var TABS=[['home','Главная','home'],['learn','Учить','learn'],['test','Тест','test'],['words','Слова','list']];
function renderBar(){
  bar.querySelector('nav').innerHTML=TABS.map(function(t){
    return '<button class="tab" data-a="tab" data-t="'+t[0]+'"'+(tab===t[0]?' aria-current="page"':'')+'>'+I(t[2])+'<span>'+t[1]+'</span></button>';
  }).join('');
}
function render(){
  if(!S.name){view.innerHTML=welcomeView();bar.hidden=true;return;}
  if(mode){
    if(mode.type==='quiz'&&mode.i>=mode.qs.length&&!mode.saved){mode.saved=true;finishQuiz();}
    view.innerHTML=mode.type==='cards'?cardsView():quizView();bar.hidden=true;
  }else{
    var v={home:homeView,learn:learnView,test:testView,words:wordsView}[tab];
    view.innerHTML=v();bar.hidden=false;renderBar();
  }
  view.style.animation='none';void view.offsetWidth;view.style.animation='';
}
function top(){try{window.scrollTo(0,0);}catch(e){}}

/* ---------- Events ---------- */
var A={
 tab:function(t){tab=t.dataset.t;settingsOpen=false;render();top();},
 settings:function(){settingsOpen=!settingsOpen;confirmReset=false;render();},
 rename:function(){var v=(document.getElementById('renameinput').value||'').trim();if(v){S.name=v;save();settingsOpen=false;render();}},
 reset:function(){confirmReset=true;render();},
 'reset-no':function(){confirmReset=false;render();},
 'reset-yes':function(){S.box={};S.results={};save();confirmReset=false;settingsOpen=false;render();},
 continue:function(){
   var g=nextGroup();
   if(g===null){startCards(shuffle(WORDS.map(function(w){return w.id;})).slice(0,10),'Повторение',null,'');}
   else{A.topic({dataset:{g:g}});}
 },
 topic:function(t){
   var g=+t.dataset.g,ids=WORDS.filter(function(w){return w.g===g;}).map(function(w){return w.id;});
   startCards(ids,DATA.groups[g].title,g,DATA.groups[g].tip);top();
 },
 repeat:function(){var ws=shuffle(weakWords()).slice(0,10).map(function(w){return w.id;});if(ws.length){startCards(ws,'Повторение',null,'');top();}},
 final:function(){startQuiz('final',null);top();},
 'topic-test':function(t){startQuiz('g'+t.dataset.g,+t.dataset.g);top();},
 exit:function(){mode=null;render();top();},
 reveal:function(){mode.shown=true;render();},
 know:function(){var id=mode.ids[mode.i];bump(id,true);mode.know++;mode.i++;mode.shown=false;render();top();},
 again:function(){
   var id=mode.ids[mode.i];bump(id,false);mode.again++;
   if(!mode.req[id]){mode.req[id]=1;mode.ids.push(id);}
   mode.i++;mode.shown=false;render();top();
 },
 pick:function(t){
   if(mode.picked!==null) return;
   var q=mode.qs[mode.i],id=+t.dataset.id,ok=id===q.id;
   mode.picked=id;
   if(ok) mode.score++; else mode.wrong.push(q.id);
   bump(q.id,ok);render();
 },
 next:function(){mode.i++;mode.picked=null;render();top();},
 'quiz-again':function(){startQuiz(mode.key,mode.g);top();},
 'redo-wrong':function(){var ids=mode.wrong.slice();startCards(ids,'Работа над ошибками',null,'');top();}
};
document.addEventListener('click',function(e){
  var s=e.target.closest('[data-say]');
  if(s){e.preventDefault();speak(s.getAttribute('data-say'));return;}
  var t=e.target.closest('[data-a]');
  if(t&&A[t.dataset.a]) A[t.dataset.a](t);
});
document.addEventListener('submit',function(e){
  if(e.target.id==='nameform'){
    e.preventDefault();
    var v=(document.getElementById('nameinput').value||'').trim();
    if(v){S.name=v;save();render();top();}
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){filter=e.target.value;var wl=document.getElementById('wl');if(wl)wl.innerHTML=listHtml();}
});
if(canSpeak){try{speechSynthesis.getVoices();}catch(e){}}
render();
})();
</script>
</body></html>
